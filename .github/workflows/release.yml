name: Release

# Un tag produce el binario. La máquina de quien programa es un editor; esta
# fábrica es la que construye lo que se distribuye, con la misma cadena de
# herramientas todas las veces.
on:
  push:
    tags:
      - 'v*'
  # Permite construir un bundle desde una rama sin poner un tag, para probar
  # la fábrica antes de necesitarla.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Fijada, no `stable`: dos builds del mismo tag tienen que producir el
          # mismo binario, y `stable` avanza sin avisar.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # La firma llega por secretos y se escribe justo antes de compilar. El
      # keystore viaja en base64 porque un secreto de GitHub es texto.
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta ANDROID_KEYSTORE_BASE64. Sin material de firma no hay bundle publicable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Sin este archivo el bundle compila igual y sale sin avisos, en
      # silencio. Es el mismo material sensible que el keystore: no se versiona
      # y llega por secreto.
      - name: Restore the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta GOOGLE_SERVICES_JSON. Un release sin ella se instala sin avisos y nadie se entera."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Build App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=APP_FLAVOR=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEB_BASE_URL="$WEB_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --obfuscate \
            --split-debug-info=build/symbols

      # Los símbolos se guardan aparte del bundle. Sin ellos, una traza de un
      # binario ofuscado es una lista de letras.
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/upload.jks"
