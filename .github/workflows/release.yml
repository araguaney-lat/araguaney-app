name: Release

# Un tag produce el binario. La máquina de quien programa es un editor; esta
# fábrica es la que construye lo que se distribuye, con la misma cadena de
# herramientas todas las veces.
on:
  push:
    tags:
      - 'v*'
  # Permite construir un bundle desde una rama sin poner un tag, para probar
  # la fábrica antes de necesitarla.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Fijada, no `stable`: dos builds del mismo tag tienen que producir el
          # mismo binario, y `stable` avanza sin avisar.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # `String.fromEnvironment` solo usa su valor por defecto cuando la clave
      # no existe. `--dart-define=API_BASE_URL=` la define vacía, así que un
      # release sin estas variables no cae a localhost: apunta a ninguna parte,
      # compila, se firma y se sube sin que nada se queje. Se comprueban antes
      # de construir, como el keystore y la configuración de Firebase.
      - name: Check the build configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable API_BASE_URL. Sin ella el bundle sale apuntando a ninguna parte."
            exit 1
          fi
          if [ -z "$WEB_BASE_URL" ]; then
            echo "::error::Falta la variable WEB_BASE_URL. Los códigos QR que dibuje la aplicación no llevarían a ningún sitio."
            exit 1
          fi

      # La firma llega por secretos y se escribe justo antes de compilar. El
      # keystore viaja en base64 porque un secreto de GitHub es texto.
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta ANDROID_KEYSTORE_BASE64. Sin material de firma no hay bundle publicable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Sin este archivo el bundle compila igual y sale sin avisos, en
      # silencio. Es el mismo material sensible que el keystore: no se versiona
      # y llega por secreto.
      - name: Restore the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta GOOGLE_SERVICES_JSON. Un release sin ella se instala sin avisos y nadie se entera."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Build App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=APP_FLAVOR=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEB_BASE_URL="$WEB_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --obfuscate \
            --split-debug-info=build/symbols

      # El nombre sale de `pubspec.yaml`, que es de donde Gradle saca
      # `versionName` y `versionCode`: el archivo se llama como la versión que
      # lleva dentro, sin que nadie tenga que acordarse de renombrarlo.
      #
      # Play ignora el nombre del archivo —lee el manifiesto del bundle—, así
      # que esto no cambia lo que se publica. Cambia lo que se ve en la carpeta
      # de descargas de quien sube tres bundles en una semana.
      - name: Name the bundle after its version
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::pubspec.yaml no declara una línea version:."
            exit 1
          fi
          name="${version%%+*}"
          code="${version##*+}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/araguaney-$name+$code.aab"
          echo "::notice::App Bundle araguaney-$name+$code.aab"

      # Los símbolos se guardan aparte del bundle. Sin ellos, una traza de un
      # binario ofuscado es una lista de letras.
      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: araguaney-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          path: build/symbols
          if-no-files-found: error

      # Los símbolos también van a Sentry, no solo al artefacto. Sin ellos, una
      # traza de un binario ofuscado es una lista de letras, y ese es justo el
      # binario que corre en el teléfono de quien reporta el fallo.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERSION: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
        run: |
          # Sin token no se manda nada y no se falla: quien compile un fork no
          # tiene por qué subir a nuestra organización ni romperse por no poder.
          # Es la misma regla que sigue el DSN.
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::Sin SENTRY_AUTH_TOKEN: los símbolos quedan solo como artefacto."
            exit 0
          fi
          if [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::Hay token de Sentry pero falta SENTRY_ORG o SENTRY_PROJECT."
            exit 1
          fi

          curl -sL https://sentry.io/get-cli/ | bash

          # El nombre del release tiene que ser exactamente el que arma la
          # aplicación en tiempo de ejecución (ver `lib/main.dart`), o los
          # símbolos quedan colgando de una versión que nadie está corriendo.
          release="org.araguaney.app@$VERSION"
          sentry-cli debug-files upload build/symbols
          sentry-cli releases new "$release"
          sentry-cli releases finalize "$release"

      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/upload.jks"
