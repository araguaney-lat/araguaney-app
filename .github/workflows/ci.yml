name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que la fábrica de release: un fallo que solo aparece
          # al publicar es un fallo que la integración tenía que haber visto.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # El sabor `foss` no puede inicializar Firebase aunque esta rama lo lleve
      # dentro. Que tampoco esté presente lo demuestra la rama `foss`, que quita
      # la dependencia; esto comprueba la mitad que sí se puede comprobar desde
      # aquí. Ver docs/release/foss.md.
      #
      # Se acota a esa prueba a propósito: el resto de la suite incluye las que
      # fijan los valores por defecto de `AppConfig`, y correrlas con un define
      # puesto las haría fallar por decir la verdad.
      - name: Check the foss flavor picks no push service
        run: flutter test --dart-define=APP_FLAVOR=foss test/core/push/push_flavor_test.dart

  api-client:
    name: Generated client matches the contract snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que la fábrica de release: un fallo que solo aparece
          # al publicar es un fallo que la integración tenía que haber visto.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Regenera desde el snapshot commiteado y compara. Falla si alguien editó
      # el cliente a mano o actualizó api/openapi.json sin regenerar: las dos
      # cosas rompen la promesa de que el cliente es exactamente el contrato.
      - name: Regenerate the API client
        run: |
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/api/generated

      - name: Fail if the committed client differs
        run: |
          if ! git diff --quiet -- api/openapi.json lib/core/api/generated; then
            echo "El cliente generado no corresponde al snapshot commiteado."
            echo "Regenera con: dart run swagger_parser && dart run build_runner build --delete-conflicting-outputs && dart format lib/core/api/generated"
            git diff --stat -- api/openapi.json lib/core/api/generated
            exit 1
          fi
