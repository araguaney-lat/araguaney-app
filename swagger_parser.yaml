# Generación del cliente de API desde el contrato vendoreado.
#
# El código de salida NO se edita a mano: para adoptar capacidades nuevas del
# backend se actualiza api/openapi.json en su propio commit y se regenera con
#   dart run swagger_parser
# El CI verifica que lo commiteado corresponda al snapshot commiteado.

swagger_parser:
  schema_path: api/openapi.json
  output_directory: lib/core/api/generated
  language: dart
  json_serializer: json_serializable
  client_postfix: Api
  put_clients_in_folder: true
  put_in_folder: false
  enums_to_json: true
  unknown_enum_value: true
  squash_clients: false
  prefer_schema_source: true
  replacement_rules: []

  # El snapshot se conserva completo y fiel a lo que publica el backend, pero
  # solo se genera cliente para la superficie que esta aplicación consume.
  #
  # Eso es `/v1` más las dos fichas públicas por código. Estas últimas devuelven
  # JSON tipado (`BoxPublicOut`, `PalletPublicOut`) y son la única forma de
  # resolver un código escaneado que no esté en el cache: no hay ruta
  # autenticada que traduzca código a identificador. Sus variantes `qr.png`
  # quedan fuera, que esas sí sirven una imagen a un navegador.
  #
  # Fuera queda también el sondeo de salud y el webhook de terceros, que no los
  # llama un cliente móvil. (El backend ya corrigió el operationId duplicado de
  # `/health/jobs`, así que podría generarse; sigue fuera porque nadie lo usa.)
  include_paths:
    - /v1/**
    - /b/{code}
    - /p/{code}

  # `GET /v1/public/qr/{code}` declara una respuesta `anyOf` —caja o tarima,
  # según qué código sea— y el generador no sabe expresar eso: emite una
  # referencia a un tipo sellado que después no crea, y el cliente no compila.
  # Es la misma clase de limitación que impide generar el inicio de sesión, que
  # tiene dos desenlaces.
  #
  # La única palanca que da la herramienta para esto es excluir por etiqueta, y
  # ese endpoint está bajo `dashboard`. Se excluye entera. La aplicación no
  # consume hoy ninguna de esas rutas: un código escaneado se resuelve por las
  # fichas públicas de caja y tarima, que sí son tipadas.
  #
  # Cuando la fase 10 necesite `/v1/dashboard/**`, esto se vuelve a abrir y hay
  # que resolver el `anyOf` —a mano, como el login, o esperando al generador—.
  # Se reportó aguas arriba.
  exclude_tags:
    - dashboard
